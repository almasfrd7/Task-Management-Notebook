<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Task Notebook</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="notebook" aria-labelledby="page-title">
        <header class="notebook-header">
            <div>
                <p class="eyebrow">Daily notes</p>
                <h1 id="page-title">My task notebook</h1>
                <p class="subtitle">A small place for the things worth remembering.</p>
            </div>
            <div class="page-number" aria-hidden="true">01</div>
        </header>

        <section class="form" aria-labelledby="new-task-title">
            <p class="section-label" id="new-task-title">New entry</p>
            <div class="form-fields">
                <input type="text" id="title" placeholder="What needs doing?" aria-label="Task title">
                <input type="text" id="description" placeholder="A little context (optional)" aria-label="Task description">
                <button onclick="addTask()" type="button">Add to list <span aria-hidden="true">+</span></button>
            </div>
        </section>

        <section aria-labelledby="tasks-title">
            <div class="tasks-heading">
                <h2 id="tasks-title">Today&apos;s list</h2>
                <span class="rule" aria-hidden="true"></span>
            </div>
            <div id="taskList"></div>
        </section>

        <footer class="notebook-footer">Keep it simple. Keep moving.</footer>
    </main>

    <script src="script.js"></script>

</body>

</html>
