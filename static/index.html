<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Task Manager</h1>

        <p class="subtitle">
            HTML + CSS + JavaScript + FastAPI
        </p>

        <!-- Add Task -->

        <div class="form">

            <input
                type="text"
                id="title"
                placeholder="Task title"
            >

            <input
                type="text"
                id="description"
                placeholder="Task description"
            >

            <button onclick="addTask()">
                Add Task
            </button>

        </div>


        <!-- Task List -->

        <h2>My Tasks</h2>

        <div id="taskList"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
